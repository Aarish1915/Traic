<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRAIC Admin Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background-color: #000000; color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Inter", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
      
      /* Desktop: sidebar visible, full comfortable padding */
      @media (min-width: 1024px) {
        .admin-main { padding: 32px 40px !important; padding-top: 32px !important; }
      }
      /* Tablet & Mobile: slide-out drawer, top bar spacing, full viewport table */
      @media (max-width: 1023px) {
        .admin-main {
          padding: 20px 20px !important;
          padding-top: 68px !important;
          min-width: 0 !important;
          width: 100% !important;
          max-width: 100vw !important;
          overflow-x: hidden !important;
          box-sizing: border-box !important;
        }
        .admin-table-wrap {
          width: 100% !important;
          max-width: 100% !important;
          overflow-x: auto !important;
          -webkit-overflow-scrolling: touch !important;
          border-radius: 14px !important;
        }
        .admin-info-bar { flex-wrap: wrap !important; gap: 10px !important; }
        .admin-info-bar > button, .admin-info-bar > a { width: 100% !important; }
        .admin-grid-2 { grid-template-columns: 1fr !important; }
      }
      @media (max-width: 640px) {
        .admin-main {
          padding: 14px 12px !important;
          padding-top: 68px !important;
        }
      }
      
      /* Modal fullscreen on mobile */
      @media (max-width: 640px) {
        .edit-modal-box {
          width: 100% !important;
          max-width: 100% !important;
          height: 100vh !important;
          max-height: 100vh !important;
          border-radius: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <a href="#admin-main-content" class="admin-skip-link">Skip to administration content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
