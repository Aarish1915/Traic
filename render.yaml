services:
  # ========================================================
  # TRAIC API Backend Service (Node.js / Express 5)
  # ========================================================
  - type: web
    name: traic-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @traic/shared build && pnpm --filter @traic/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ADMIN_PASSWORD
        sync: false
        value: traic_admin_2025!
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
